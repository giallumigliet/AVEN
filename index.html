<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AVEN</title>
  <link rel="stylesheet" href="./src/style.css">
</head>

<body>
  <div class="app" id="app">
    
    <!-- AUTH GATE ====================================================== -->
    <div class="auth-gate" id="auth-gate">
      <div class="auth-card">
        <div class="auth-orb">
          <span></span>
        </div>
        <div class="auth-status">AVEN</div>
        <h1>Welcome to AVEN</h1>
        <p>Sign in to continue</p>
        <button class="login-button" id="login-button" type="button">
          <span class="google-icon">G</span>
          Continue with Google
        </button>
      </div>
    </div>
    
    <!-- HEADER ====================================================== -->
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-button menu-button" id="menu-button" type="button" aria-label="Open menu" aria-expanded="true">
          ☰
        </button>
        
        <div class="brand">
          <span class="status-dot"></span>
          <span>AVEN</span>
        </div>
      </div>
      
      <div class="topbar-right">
        <div class="weather">
          <button id="weather-button" class="weather-button" type="button" aria-label="Weather">
            <span class="location"> </span>
            <span class="weather-icon"> </span>
            <span class="temperature"> </span>
            <span class="weather-warning"> </span>
          </button>
  
          <div id="weather-panel" class="weather-panel">
              <div class="weather-tabs">
                <button id="weather-hourly-tab" class="weather-tab active" type="button">Orarie</button>
                <button id="weather-daily-tab" class="weather-tab" type="button">Giorni</button>
              </div>

              <div id="weather-hourly"> </div>
              <div id="weather-daily"> </div>
          </div>
        </div>

        
        <div class="account">
          <button class="profile-button" id="profile-button" type="button" aria-label="Account" aria-expanded="false">
            <img id="user-photo" alt="Profile">
          </button>
          
          <div class="account-menu" id="account-menu">
            <button class="account-menu-item" id="light-dark-button" type="button"> Light/Dark mode </button>
            <button class="account-menu-item" id="change-account-button" type="button"> Change account </button>
            <button class="account-menu-item" id="logout-button" type="button"> Logout </button>
            <button class="account-menu-item danger" id="reset-data-button" type="button"> Reset data </button>
          </div>
        </div>
      </div>
    </header>
    
    <!-- CONTENT ====================================================== -->
    <div class="content">
      <div class="sidebar-backdrop" id="sidebar-backdrop"></div>


      <!-- SIDEBAR ==================================================== -->
      <aside class="sidebar" id="sidebar">
        <button id=check-calendar-sidebar class="nav-item active" type="button">
          <span class="nav-icon">□</span>
          <span>Check calendar</span>
        </button>

        <button id=to-do-sidebar class="nav-item" type="button">
          <span class="nav-icon">✓</span>
          <span>To do lists</span>
        </button>

        <button id=routines-sidebar class="nav-item" type="button">
          <span class="nav-icon">↺</span>
          <span>Routines</span>
        </button>

        <button id=health-sidebar class="nav-item" type="button">
          <span class="nav-icon">♡</span>
          <span>Health</span>
        </button>

        <button id=birthdays-sidebar class="nav-item" type="button">
          <span class="nav-icon">☆</span>
          <span>Birthdays</span>
        </button>

        <button id=home-sidebar class="nav-item" type="button">
          <span class="nav-icon">⌂</span>
          <span>Home</span>
        </button>
      </aside>

      <!-- MAIN ==================================================== -->
      <main>

        <section class="greeting">
          <p class="greeting-subtitle">Good evening</p>
          <h1 class="greeting-title">How can I help?</h1>
        </section>

        <section class="assistant-area">
          <div class="assistant-core">
            <span class="assistant-status">Ready</span>
          </div>

          <section class="daily-panel">
            <div class="daily-header">
              <div class="daily-title">
                <span class="daily-label">Your day</span>
                <h2>Daily overview</h2>
              </div>

              <span class="daily-date">Today · Tuesday</span>
            </div>

            <div class="daily-items">

              <article class="daily-item">
                <div class="daily-item-top">
                  <span class="daily-item-icon">✓</span>
                  <span class="daily-item-count">4</span>
                </div>
                <span class="daily-item-name">Tasks</span>
              </article>

              <article class="daily-item">
                <div class="daily-item-top">
                  <span class="daily-item-icon">◷</span>
                  <span class="daily-item-count">2</span>
                </div>
                <span class="daily-item-name">Events</span>
              </article>

              <article class="daily-item">
                <div class="daily-item-top">
                  <span class="daily-item-icon">♡</span>
                  <span class="daily-item-count">1</span>
                </div>
                <span class="daily-item-name">Birthday</span>
              </article>

            </div>
          </section>
        </section>

        <form class="command" id="command-form">
          <input class="command-input" type="text" placeholder="Ask anything..." autocomplete="off">
          <button class="mic-button" type="button" aria-label="Microphone">
            🎙
          </button>
        </form>
      </main>

      <!-- ROUTINE MODAL ================================================ -->
      <div class="modal-backdrop" id="routine-modal-backdrop"></div>
      
      <section class="routine-modal" id="routine-modal" aria-hidden="true">
      
        <div class="routine-modal-header">
          <div>
            <span class="daily-label">New routine</span>
            <h2>What do you want to repeat?</h2>
            <div class="daily-label" id="routine-preview"> Every Monday at 20:00 </div>
          </div>
      
          <button
            class="icon-button"
            id="close-routine-modal"
            type="button"
            aria-label="Close"
          >
            ×
          </button>
        </div>
      
      
        <form id="routine-form">
      
          <!-- NOME ====================================================== -->
          <div class="routine-field">
            <label for="routine-name">Routine</label>
      
            <input
              id="routine-name"
              class="routine-input"
              type="text"
              placeholder="e.g. Take vitamins"
              autocomplete="off"
              required
            >
          </div>
      
      
          <!-- RIPETIZIONE =============================================== -->
          <div class="routine-field">
      
            <label>Repeat</label>
      
            <div class="repeat-row">
      
              <span>Every</span>
      
              <input
                id="routine-interval"
                class="interval-input"
                type="number"
                min="1"
                value="1"
                inputmode="numeric"
              >
      
              <select id="routine-unit" class="routine-select">
                <option value="days">days</option>
                <option value="weeks">weeks</option>
                <option value="months">months</option>
              </select>
      
            </div>
      
          </div>
      
      
          <!-- GIORNI DELLA SETTIMANA ==================================== -->
          <div
            class="routine-field routine-conditional"
            id="weekly-days-field"
            hidden
          >
      
            <label>On</label>
      
            <div class="weekday-picker">
      
              <button type="button" data-day="1">Mon</button>
              <button type="button" data-day="2">Tue</button>
              <button type="button" data-day="3">Wed</button>
              <button type="button" data-day="4">Thu</button>
              <button type="button" data-day="5">Fri</button>
              <button type="button" data-day="6">Sat</button>
              <button type="button" data-day="0">Sun</button>
      
            </div>
      
          </div>
      
      
          <!-- GIORNO DEL MESE =========================================== -->
          <div
            class="routine-field routine-conditional"
            id="monthly-day-field"
            hidden
          >
      
            <label for="routine-month-day">Day of the month</label>
      
            <input
              id="routine-month-day"
              class="routine-input small"
              type="number"
              min="1"
              max="31"
              value="1"
              inputmode="numeric"
            >
      
          </div>
      
      
          <!-- DATA DI PARTENZA ========================================== -->
          <div class="routine-field">
      
            <label for="routine-start">Starting from</label>
      
            <input
              id="routine-start"
              class="routine-input"
              type="date"
            >
      
          </div>
      
      
          <!-- ORARI ===================================================== -->
          <div class="routine-field">
      
            <div class="field-label-row">
              <label>Time <span>(optional)</span></label>
      
              <button
                type="button"
                class="add-time-button"
                id="add-routine-time"
              >
                + Add time
              </button>
            </div>
      
            <div
              class="routine-times"
              id="routine-times"
            >
              <!-- gli orari vengono inseriti via JS -->
            </div>
      
          </div>
      
      
          <!-- AZIONI ==================================================== -->
          <div class="routine-actions">
      
            <button
              type="button"
              class="secondary-button"
              id="cancel-routine"
            >
              Cancel
            </button>
      
            <button
              type="submit"
              class="primary-button"
            >
              Add routine
            </button>
      
          </div>
      
        </form>
      
      </section>



      <!-- BIRTHDAYS ==================================================== -->
      
      <section class="birthdays-page" id="birthdays-page" hidden>
      
        <div class="section-header">
          <div>
            <span class="section-label">People</span>
            <h2>Birthdays</h2>
          </div>
      
          <button
            type="button"
            class="primary-button"
            id="add-birthday-button"
          >
            + Add birthday
          </button>
        </div>
      
        <div class="birthdays-list" id="birthdays-list">
          <!-- Birthdays will appear here -->
        </div>
      
      </section>
      
      
      <!-- BIRTHDAY MODAL ==================================================== -->
      
      <div
        class="birthday-modal"
        id="birthday-modal"
        aria-hidden="true"
      >
      
        <div
          class="birthday-modal-backdrop"
          id="birthday-modal-backdrop"
        ></div>
      
        <div class="birthday-modal-content">
      
          <div class="birthday-modal-header">
      
            <div>
              <span class="section-label">New</span>
              <h2>Add birthday</h2>
            </div>
      
            <button
              type="button"
              class="close-modal-button"
              id="close-birthday-modal"
              aria-label="Close"
            >
              ×
            </button>
      
          </div>
      
      
          <form id="birthday-form">
      
            <div class="birthday-field">
      
              <label for="birthday-name">
                Name
              </label>
      
              <input
                id="birthday-name"
                type="text"
                placeholder="Marco"
                autocomplete="off"
                required
              >
      
            </div>
      
      
            <div class="birthday-field">
      
              <label for="birthday-date">
                Date of birth
              </label>
      
              <input
                id="birthday-date"
                type="date"
                required
              >
      
            </div>
      
      
            <div
              class="birthday-preview"
              id="birthday-preview"
            ></div>
      
      
            <div class="birthday-actions">
      
              <button
                type="button"
                class="secondary-button"
                id="cancel-birthday"
              >
                Cancel
              </button>
      
              <button
                type="submit"
                class="primary-button"
              >
                Add birthday
              </button>
      
            </div>
      
          </form>
      
        </div>
      
      </div>



      
    </div>
  </div>

  <script type="module" src="./src/script.js"></script>
</body>
</html>
